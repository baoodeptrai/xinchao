<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard Chia Sẻ Trên GitHub Pages</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; }

    header {
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-title { font-size: 1.2rem; font-weight: 700; color: var(--accent-blue); }
    .header-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem 2rem;
    }

    .grid-sidebar {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 1000px) {
      .grid-sidebar { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-green { background: rgba(34,197,94,0.2); color: var(--accent-green); }
    .badge-blue { background: rgba(56,189,248,0.2); color: var(--accent-blue); }
    .badge-amber { background: rgba(245,158,11,0.2); color: var(--accent-amber); }
    .badge-red { background: rgba(239,68,68,0.18); color: var(--accent-red); }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 180px;
      overflow-y: auto;
    }

    .client-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .color-picker { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .color-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    }
    .color-btn.active { border-color: #fff; transform: scale(1.08); }

    .log-box {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      height: 170px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      color: #dbeafe;
    }
    .log-line { margin-bottom: 0.25rem; word-break: break-word; }

    .btn {
      background: var(--accent-blue);
      color: #000;
      border: 0;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-danger {
      background: var(--accent-red);
      color: #fff;
    }

    .canvas-container {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.5rem;
    }
    canvas.drawing-canvas {
      display: block;
      width: 100%;
      height: 560px;
      background: #fff;
      border-radius: 6px;
      cursor: crosshair;
      touch-action: none;
    }

    .muted { color: var(--text-muted); }
    input[type="text"] {
      width: 100%; padding: 0.7rem 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;
      background: #0f172a; color: var(--text-main); margin-bottom: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">🌐 Whiteboard Chia Sẻ</div>
    <div class="header-sub">Chạy trên GitHub Pages / link deploy đúng, chia sẻ trong cùng tab/ trình duyệt bằng BroadcastChannel</div>
  </header>

  <main>
    <div class="grid-sidebar">
      <div>
        <div class="card">
          <div class="card-title">
            <span>Trạng thái</span>
            <span id="connStatus" class="badge badge-green">Online</span>
          </div>
          <p class="muted" style="font-size:0.75rem; margin-bottom:0.4rem;">Dùng đúng link GitHub Pages mới có thể đồng bộ</p>
          <p class="muted" style="font-size:0.75rem;">
            Client: <strong id="myClientId" style="color:var(--accent-blue);">Client_You</strong>
          </p>
        </div>

        <div class="card">
          <div class="card-title">
            <span>Danh sách client</span>
            <span id="clientCountBadge" class="badge badge-blue">1 Online</span>
          </div>
          <div class="client-list" id="clientListContainer"></div>
        </div>

        <div class="card">
          <div class="card-title"><span>Thêm người</span></div>
          <input id="userNameInput" type="text" placeholder="Nhập tên người..." />
          <button class="btn" onclick="addUserFromInput()">Thêm người</button>
        </div>

        <div class="card">
          <div class="card-title"><span>Công cụ vẽ</span></div>
          <div style="margin-bottom:0.75rem;">
            <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Màu sắc nét cọ:</label>
            <div class="color-picker">
              <div class="color-btn active" style="background-color:#0f172a;" onclick="setColor('#0f172a', this)"></div>
              <div class="color-btn" style="background-color:#ef4444;" onclick="setColor('#ef4444', this)"></div>
              <div class="color-btn" style="background-color:#22c55e;" onclick="setColor('#22c55e', this)"></div>
              <div class="color-btn" style="background-color:#38bdf8;" onclick="setColor('#38bdf8', this)"></div>
            </div>
          </div>

          <div style="margin-bottom:1rem;">
            <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Độ dày: <span id="sizeVal">4</span>px</label>
            <input type="range" id="brushSize" min="1" max="20" value="4" style="width:100%; accent-color:var(--accent-blue);" oninput="document.getElementById('sizeVal').textContent=this.value">
          </div>

          <button class="btn btn-danger" onclick="clearBoard()">Xóa bảng</button>
        </div>

        <div class="card">
          <div class="card-title"><span>Nhật ký</span></div>
          <div class="log-box" id="netLogs"></div>
        </div>
      </div>

      <div class="card" style="display:flex; flex-direction:column;">
        <div class="card-title">
          <span>Bảng vẽ</span>
          <span class="badge badge-green">Share via link</span>
        </div>
        <div class="canvas-container" style="flex:1; margin-bottom:0;">
          <canvas id="whiteboard" class="drawing-canvas" width="1000" height="600"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script>
    const channel = 'whiteboard-room';
    const bc = 'BroadcastChannel' in window ? new BroadcastChannel(channel) : null;
    const myId = 'Client_' + Math.floor(Math.random() * 9000 + 1000);
    document.getElementById('myClientId').textContent = myId;

    const activeClients = new Map();
    activeClients.set(myId, { id: myId, status: 'Đang hoạt động' });

    function updateClientListUI() {
      const container = document.getElementById('clientListContainer');
      const badge = document.getElementById('clientCountBadge');
      if (!container || !badge) return;

      container.innerHTML = '';
      badge.textContent = `${activeClients.size} Online`;

      activeClients.forEach((client, id) => {
        const item = document.createElement('div');
        item.className = 'client-item';
        item.innerHTML = `
          <span><b>${id}</b> ${id === myId ? '(Bạn)' : ''}</span>
          <span class="badge badge-green">${client.status}</span>
        `;
        container.appendChild(item);
      });
    }

    function logNet(msg) {
      const logs = document.getElementById('netLogs');
      if (!logs) return;
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `[${time}] ${msg}`;
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
    }

    function addUser(name) {
      const safe = (name || '').trim();
      if (!safe) return;
      const id = 'Client_' + safe.replace(/\s+/g, '_');
      activeClients.set(id, { id, status: 'Đang hoạt động' });
      updateClientListUI();
      logNet(`Đã thêm người mới: ${id}`);
    }

    function addUserFromInput() {
      const input = document.getElementById('userNameInput');
      if (!input) return;
      addUser(input.value);
      input.value = '';
    }

    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentColor = '#0f172a';
    let lastX = 0, lastY = 0;

    function getCursorPos(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function drawLine(x1, y1, x2, y2, color, size) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.closePath();
    }

    function publishDraw(payload) {
      if (bc) bc.postMessage(payload);
      const raw = JSON.stringify(payload);
      localStorage.setItem('whiteboard-shared', raw);
    }

    function syncDraw(payload) {
      if (payload.sender === myId) return;
      if (payload.type === 'draw') {
        drawLine(payload.x1, payload.y1, payload.x2, payload.y2, payload.color, payload.size);
      }
      if (payload.type === 'clear') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function startPosition(e) {
      e.preventDefault();
      painting = true;
      const pos = getCursorPos(e);
      lastX = pos.x;
      lastY = pos.y;
    }

    function drawPosition(e) {
      if (!painting) return;
      e.preventDefault();
      const pos = getCursorPos(e);
      const currentX = pos.x;
      const currentY = pos.y;
      const size = document.getElementById('brushSize').value;

      drawLine(lastX, lastY, currentX, currentY, currentColor, size);
      const payload = {
        sender: myId,
        type: 'draw',
        x1: lastX, y1: lastY,
        x2: currentX, y2: currentY,
        color: currentColor,
        size: Number(size)
      };
      publishDraw(payload);
      lastX = currentX;
      lastY = currentY;
    }

    function endPosition(e) {
      if (!painting) return;
      if (e && e.preventDefault) e.preventDefault();
      painting = false;
    }

    function setColor(color, element) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
    }

    function clearBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const payload = { sender: myId, type: 'clear' };
      if (bc) bc.postMessage(payload);
      localStorage.setItem('whiteboard-shared', JSON.stringify(payload));
      logNet('Bạn đã xóa bảng vẽ.');
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mousemove', drawPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mouseleave', endPosition);

    canvas.addEventListener('touchstart', startPosition, { passive: false });
    canvas.addEventListener('touchmove', drawPosition, { passive: false });
    canvas.addEventListener('touchend', endPosition);

    if (bc) {
      bc.onmessage = (event) => {
        const payload = event.data;
        syncDraw(payload);
      };
    }

    const saved = localStorage.getItem('whiteboard-shared');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (data.type === 'draw') {
          drawLine(data.x1, data.y1, data.x2, data.y2, data.color, data.size);
        }
      } catch (e) {}
    }

    updateClientListUI();
    logNet('Đã sẵn sàng. Nếu mở cùng link ở nhiều tab, vẽ sẽ đồng bộ trong cùng trình duyệt.');
    logNet('Lưu ý: để nhiều người khác thiết bị cùng vẽ, cần backend thật như Supabase/Firebase/WebSocket.');
  </script>
</body>
</html>
